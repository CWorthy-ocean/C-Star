[project]
name = "cstar-ocean"
description = "Computational systems for tracking ocean carbon"
readme = "README.md"
urls = { repository = "https://github.com/CWorthy-ocean/C-Star", homepage = "https://www.cworthy.org" }
authors = [
    { name = "Dafydd Stephenson", email = "dafydd@cworthy.org" },
    { name = "Thomas Nicholas", email = "tom@cworthy.org" },
    { name = "Nora Loose", email = "nora@cworthy.org" },
    { name = "Matt Long", email = "matt@cworthy.org" },
    { name = "Scott Eilerman", email = "scott.eilerman@cworthy.org" },
    { name = "Chris McBride", email = "chris@cworthy.org" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Oceanography"
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fakeredis<2.35",
    "networkx>=3.6.1",
    "psutil>=7.2.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "python-dateutil>=2.8.2",
    "pytimeparse>=1.1.8",
    "python-dotenv",
    "PyYAML>=6.0,<7",
    "f90nml>=1.4",
    "numpy>2.0,<2.4",
    # >=5.0: `InitialConditions` requires `bgc_model=` alongside `bgc_source=` (used by
    # cstar.applications.nest_ic), and cstar-forge builds on the 5.0 wrapper API, so a
    # `<5` ceiling would make forge and cstar-ocean uninstallable together. dask is a
    # core roms-tools dependency as of 4.0.1 (the [dask] extra is gone).
    "roms_tools>=5.0,<6",
    "typer<=0.25",
    # -- direct imports in cstar.applications.forge (arrive with the forge
    # application; psutil, pydantic, PyYAML, numpy, typer, and roms_tools above
    # are already required, so are not repeated here) --
    "jinja2",
    "pandas",
    "copernicusmarine",
    "gdown",
    "dask",
    "distributed",
    "threadpoolctl",
    "numba",
    "fsspec",
    "kerchunk",
    "nest-asyncio",
    "ujson",
    "fastparquet",
    "xarray",
    # -- the wizard (cstar.wizard) -- kitchen-sink decision: the wizard ships
    # as a core dependency, not an optional extra, so `pip install cstar-ocean`
    # is enough to run it --
    "ipywidgets",
    "voila",
    "jupyterlab",
    "matplotlib",
    "ipython",
]
keywords = ["MCDR", "CDR", "ocean carbon", "climate"]

[project.optional-dependencies]
dev = [
    "check-manifest",
    "coverage>=7.13",
    "mypy>=1.16.1",
    # forge's test suite (cstar/tests/unit_tests/applications/forge/) reads/writes
    # NetCDF fixtures directly via netCDF4, not only through xarray/roms_tools.
    "netCDF4",
    "pooch>=1.8.1",
    "pre-commit==3.8.0",
    "pytest>=7.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.2",
    "types-python-dateutil>=2.9.0",
    "types-pytz>=2025.2.0",
    "types-PyYAML>=6.0.12",
    "types-requests>2.32.4",
]
docs = [
    "nbsphinx",
    "readthedocs-sphinx-ext",
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-napoleon",
    "sphinx-book-theme",
    "sphinx-design",
]

[project.scripts]
cstar = "cstar.cli.cli:main"

[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "setuptools_scm[toml]>=7.0",
]
build-backend = "setuptools.build_meta"

# check-manifest builds a clean sdist from a git-free copy of the tree, so files
# that setuptools_scm's VCS file finder would normally pick up (it needs .git)
# are reported missing unless MANIFEST.in covers them too. These are dev-only
# files intentionally not shipped in the sdist/wheel: docs, CI/release tooling,
# lint/coverage config, conda env pins, and non-.py test fixtures (test .py
# files are still picked up via normal package discovery).
[tool.check-manifest]
ignore = [
    ".pre-commit-config.yaml",
    ".readthedocs.yaml",
    "ci/**",
    "codecov.yml",
    "coverage.toml",
    "cstar/tests/**",
    "docs/**",
    "environment-hpc.yml",
    "environment-laptop.yml",
]

[tool.setuptools_scm]
fallback_version = "9999"

# Configuration for mypy type checker
[tool.mypy]
ignore_missing_imports = true
exclude = "properties|asv_bench|docs"

# Configuration for ruff linter and formatter
[tool.ruff]
fix = true
show-fixes = true
line-length = 88
# Keep lint behavior stable across the requires-python 3.10->3.12 bump: without this,
# ruff infers py312 and demands PEP 695 syntax (UP040/UP046/UP047) in applications/core.py.
# That modernization is a deliberate, separate change - do it repo-wide when ready and
# bump this to py312.
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "F", "E", "W", "D", "UP", "TCH", "RUF"]
ignore = [
    # will fix eventually
    "E501",
    "D205",
    "D102",
    "D101",
    "D400",
    "D103",
    "D106",
    # maybe fix
    "D100",
    "D401",
    "D104", # will this show up in the readthedocs?
    # won't fix
    "D105",
    "D107", # if you're doing wacky init stuff, please document
    # RUF rules both this repo and cstar-forge found too noisy (same ignore list
    # there): regex metacharacters in pytest.raises(match=...) are intentional,
    # and unused unpacked names document a tuple's shape.
    "RUF043",
    "RUF059",
    # Ambiguous-unicode in strings: forge's user-facing messages use intentional
    # glyphs (ℹ info markers, × in "npx × npy").
    "RUF001",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field annotations at runtime, including those of dataclasses
# used as model field types, so TCH must not move their imports into
# `if TYPE_CHECKING:` blocks. Same settings as cstar-forge (relocating here).
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]


[tool.pre-commit]
config = ".pre-commit-config.yaml"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "examples*", "additional_files*", "externals*", "ci*", "build*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
norecursedirs = [".tox", ".git", "__pycache__", ".#*", "*~"]
log_cli_format = "%(asctime)s | %(levelname)s | %(name)s::%(funcName)s:%(lineno)d: %(message)s"
log_cli_level = "INFO"
asyncio_mode = "auto"
# Registered for the forge test suite (relocating here): `network` needs live
# GitHub/data access, `slow` is deselected in quick runs. Selection stays by path.
markers = [
    "network: tests requiring live network access (deselect with -m 'not network')",
    "slow: slow-running tests (deselect with -m 'not slow')",
]


# Use addopts to ignore specific files and directories
addopts = [
    "--ignore-glob=cstar/cstar_local_config.py",
    "--ignore-glob=cstar/externals/**",
    "--ignore-glob=examples/**.py",
    "--ignore-glob=*~",
    "--ignore-glob=.#*"
]
