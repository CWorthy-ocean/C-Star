name: cstar-env
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.15
  - pip
  - roms-tools>=5.3.0,<6
  # forge application runtime dependencies
  - jinja2
  - pandas
  - copernicusmarine
  - gdown
  - dask
  - distributed
  - threadpoolctl
  - numba
  - fsspec
  - s3fs  # streams the CONUS404 surface source from S3
  - kerchunk
  - ujson
  - fastparquet
  - xarray>=2026.9
  # `cstar run compress`: >=1.6 for netCDF-C's native quantization
  - netcdf4>=1.6
  # wizard (cstar.wizard) runtime dependencies
  - ipywidgets
  - voila
  - jupyterlab
  - matplotlib-base
  - ipython
  # docs builds only
  - pandoc
