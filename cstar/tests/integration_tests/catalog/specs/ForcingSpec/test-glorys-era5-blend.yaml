schema_version: 2.0.0
description: "Test: as test-glorys-era5-unified, with the ERA5 surface physics blended over ERA5"

initial_conditions:
  source:
    name: GLORYS
    glorys_layout: regional
    path: "${TEST_DATA}/GLORYS_NA_2012.nc"
  bgc_sources:
    - source:
        name: UNIFIED
        climatology: true
        path: "${TEST_DATA}/coarsened_UNIFIED_bgc_dataset_v2_1.nc"

forcing:
  surface:
    - source:
        name: ERA5
        path: "${TEST_DATA}/ERA5_NA_2012.nc"
      type: physics
      correct_radiation: false
      coarse_grid_mode: "never"
      # ERA5 over ERA5: the primary covers the whole grid, so this exercises the
      # blend's plumbing (naming, recipe, sidecar, CDF-5) rather than its edge.
      blend:
        fallback:
          source:
            name: ERA5
            path: "${TEST_DATA}/ERA5_NA_2012.nc"
          correct_radiation: true
        width_km: 50
        profile: smoothstep
    - source:
        name: UNIFIED
        climatology: true
        path: "${TEST_DATA}/coarsened_UNIFIED_bgc_dataset_v2_1.nc"
      type: bgc
      coarse_grid_mode: "never"
  boundary:
    source:
      name: GLORYS
      glorys_layout: regional
      path: "${TEST_DATA}/GLORYS_NA_2012.nc"
    bgc_sources:
      - source:
          name: UNIFIED
          climatology: true
          path: "${TEST_DATA}/coarsened_UNIFIED_bgc_dataset_v2_1.nc"
  tidal: []
  river: []
