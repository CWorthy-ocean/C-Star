description: Generated blueprint (ucla-roms 0.6.4, adds &PIO_SETTINGS support)
bgc_mode: marbl
use_pio: true
code:
  roms:
    location: https://github.com/CWorthy-ocean/ucla-roms.git
    commit: 0.6.4
  marbl:
    location: https://github.com/CWorthy-ocean/MARBL.git
    commit: marbl0.45.0-max-it-10
  pio:
    location: https://github.com/CWorthy-ocean/ParallelIO.git
    commit: 2.7.1-fork
  templates_commit: 6a0a4ee55b944db316e33f58ba7aa2403e880b92  # C-Star 0.15.0
  templates_compile_time:
    directory: cstar/additional_files/templates/forge/compile-time
    files:
    - cppdefs.opt.j2
    file_hashes:
      cppdefs.opt.j2: 2942d94da83cdcad7a324f50eb4fe8728fdf7df51e522abd276f40d92ff0be73
  templates_run_time:
    directory: cstar/additional_files/templates/forge/run-time
    files:
    - marbl_in
    file_hashes:
      marbl_in: 218976e818e81001b798c1eecbbc2f659c6e3f311db24da50d990cd69c300f8f
model_settings:
  cppdefs:
    sponge_tune: false
    nhy_forcing: true
    nox_forcing: true
    auto_tiling: false
  lateral_visc:
    visc2: 0.0
    rho0: 1000.0
  vertical_mixing:
    akv: 0.0
    akt_default: 0.0
  tracer_diff2:
    tnu2_default: 0.0
  bottom_drag:
    rdrg: 0.0
    rdrg2: 0.001
    zob: 0.01
  gamma2: 1.0
  ubind: 0.1
  param:
    nt_passive: 0
    ntrc_bio: 32
  pio_settings:
    pio_stride: 1  # PIO I/O-task rank stride (ucla-roms >= 0.6.0 &PIO_SETTINGS group)
  bgc:
    nbgc_flx: 2
    interp_frc: 0
    xco2air_default: 284.7
  blk_frc:
    interp_frc: 0
    check_bulk_frc_units: false
  tides:
    bry_tides: true
    pot_tides: true
    ana_tides: false
  sponge_tune:
    pflx_w_vname: up_west
    pflx_w_tname: bry_time
    pflx_e_vname: up_east
    pflx_e_tname: bry_time
    pflx_s_vname: vp_south
    pflx_s_tname: bry_time
    pflx_n_vname: vp_north
    pflx_n_tname: bry_time
    ub_tune: false
    spn_avg: true
    sp_timscale: 86400
    wrt_sponge: false
    # nrpf * output_period (one file per day) evenly divides the restart period
    # for both the daily- and weekly-restarts OutputSpecs -- required by the
    # ucla-roms >= 0.5.0 check_output_divides_rst precheck when enabled.
    nrpf: 1
    output_period: 86400
  flux_frc:
    interp_flux_frc: true
  calc_pflx:
    calc_pflx: true
    timescale: 86400
  pipe_frc:
    pipe_source: false
    p_analytical: false
    npip: 1
  particles:
    floats: false
    np: 50
    extra_space_fac: 1.5
    exchange_facx: 0.1
    exchange_facy: 0.1
    exchange_facc: 0.01
    output_period: 400
    # 216 * 400 s = one file per day, which evenly divides the restart period
    # for both the daily- and weekly-restarts OutputSpecs -- required by the
    # ucla-roms >= 0.5.0 check_output_divides_rst precheck when enabled.
    nrpf: 216
    ppm3: 1.0e-06
    pmin: 200
  lin_rho_eos:
    tcoef: 0.2
    t0: 1.0
    scoef: 0.822
    s0: 1.0
  sss_correction:
    dsssdt: 7.777
  sst_correction:
    dsstdt: 7.777
  dic_alk_correction:
    dcdt: 7.777
  marbl_bgc:
    marbl_config_file: marbl_in
    marbl_timestep: 3600.0
