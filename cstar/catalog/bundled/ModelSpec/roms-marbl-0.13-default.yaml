schema_version: 2.0.0
description: Generated blueprint (ucla-roms 0.13.0, adds the sponge tracer diffusivity v_sponge.v_sponge_trc; averaging periods of the _cdr and _bgc_dia_avg streams must be whole multiples of the MARBL timestep)
bgc_mode: marbl
use_pio: true
code:
  roms:
    location: https://github.com/CWorthy-ocean/ucla-roms.git
    commit: 0.13.0
  marbl:
    location: https://github.com/CWorthy-ocean/MARBL.git
    commit: marbl0.45.0-max-it-10
  pio:
    location: https://github.com/CWorthy-ocean/ParallelIO.git
    commit: 2.7.1-fork
  templates_commit: d47142ec249bce91aac938030dfd5ea3f7dacfd4  # C-Star: drops the no-op EXACT_RESTARTS/PRINT_HOSTNAME keys
  # `file_hashes` is the sha256 hex digest of each listed file AS IT EXISTS AT
  # `templates_commit` in the C-Star repo -- authored by hand, not
  # computed from the templates bundled in this C-Star checkout (which may be a
  # newer commit than this pin). ForgeExecutor's local fast path only stages
  # directly from the bundled copy when it matches these hashes exactly; otherwise
  # it fetches `templates_commit` via AdditionalCode and verifies the fetch against
  # these hashes instead. Regenerate after re-pinning `templates_commit` with, from
  # a checkout of https://github.com/CWorthy-ocean/C-Star.git:
  #   git show <templates_commit>:<directory>/<file> | shasum -a 256
  templates_compile_time:
    directory: cstar/additional_files/templates/forge/compile-time
    files:
    - cppdefs.opt.j2
    file_hashes:
      cppdefs.opt.j2: 7665373d4eaad6d94215660775ca66dd87f1c2309e15edc0039c9051b20b0f00
  templates_run_time:
    directory: cstar/additional_files/templates/forge/run-time
    files:
    - marbl_in
    file_hashes:
      marbl_in: 218976e818e81001b798c1eecbbc2f659c6e3f311db24da50d990cd69c300f8f
model_settings:
  cppdefs:
    sponge_tune: false
    nhy_forcing: true
    nox_forcing: true
    auto_tiling: false
    # ucla-roms >= 0.8.0 tracer-advection switches (PR #361), both off = the 0.8.0
    # defaults (thickness-aware C4/U3 vertical scheme; full UPSTREAM_TS curvature).
    # Exposed in the wizard's "Physics & subgrid tuning" pane. Deliberately absent
    # from specs pinned to older ucla-roms tags, which ignore both keys.
    parabolic_splines: false
    upstream_ts_land_curv: false
  lateral_visc:
    visc2: 0.0
    rho0: 1000.0
  vertical_mixing:
    akv: 0.0
    akt_default: 0.0
  tracer_diff2:
    tnu2_default: 0.0
  bottom_drag:
    rdrg: 0.0
    rdrg2: 0.001
    zob: 0.01
  v_sponge:
    # Maximum tracer diffusivity in the sponge layer (ucla-roms >= 0.13.0): 0 for a
    # sponge on currents only, negative for the same as v_sponge (what earlier releases
    # always did). v_sponge itself is derived from the grid spacing.
    v_sponge_trc: -1.0
  gamma2: 1.0
  ubind: 0.1
  param:
    nt_passive: 0
    ntrc_bio: 32
  pio_settings:
    pio_stride: 1  # PIO I/O-task rank stride (ucla-roms >= 0.6.0 &PIO_SETTINGS group)
  bgc:
    nbgc_flx: 2
    interp_frc: 0
    xco2air_default: 284.7
  blk_frc:
    interp_frc: 0
    check_bulk_frc_units: false
  tides:
    bry_tides: true
    pot_tides: true
    ana_tides: false
  sponge_tune:
    pflx_w_vname: up_west
    pflx_w_tname: bry_time
    pflx_e_vname: up_east
    pflx_e_tname: bry_time
    pflx_s_vname: vp_south
    pflx_s_tname: bry_time
    pflx_n_vname: vp_north
    pflx_n_tname: bry_time
    ub_tune: false
    spn_avg: true
    sp_timscale: 86400
    wrt_sponge: false
    # nrpf * output_period (one file per day) evenly divides the restart period
    # for both the daily- and weekly-restarts OutputSpecs -- required by the
    # ucla-roms >= 0.5.0 check_output_divides_rst precheck when enabled.
    nrpf: 1
    output_period: 86400
  flux_frc:
    interp_flux_frc: true
  calc_pflx:
    calc_pflx: true
    timescale: 86400
  pipe_frc:
    pipe_source: false
    p_analytical: false
    npip: 1
  particles:
    floats: false
    np: 50
    extra_space_fac: 1.5
    exchange_facx: 0.1
    exchange_facy: 0.1
    exchange_facc: 0.01
    output_period: 400
    # 216 * 400 s = one file per day, which evenly divides the restart period
    # for both the daily- and weekly-restarts OutputSpecs -- required by the
    # ucla-roms >= 0.5.0 check_output_divides_rst precheck when enabled.
    nrpf: 216
    ppm3: 1.0e-06
    pmin: 200
  lin_rho_eos:
    tcoef: 0.2
    t0: 1.0
    scoef: 0.822
    s0: 1.0
  sss_correction:
    dsssdt: 7.777
  sst_correction:
    dsstdt: 7.777
  dic_alk_correction:
    dcdt: 7.777
  marbl_bgc:
    marbl_config_file: marbl_in
    # ucla-roms >= 0.13.0 (PR #400) stops at startup unless the _cdr and _bgc_dia_avg
    # averaging periods are whole multiples of this, rounded down to a multiple of dt.
    marbl_timestep: 3600.0
    # Constant-iron option (ucla-roms >= 0.11.0, PR #391); off by default. Fe is in mmol/m^3 (1 nM = 1e-3).
    use_constant_fe: false
    constant_fe_value: 3.0e-3
  cdr_lite:
    # Time interpolation of the carbonate sensitivities read from forcing files
    # (ucla-roms >= 0.12.0, PR #396); on by default, as earlier releases always did.
    # Read only for bgc_mode cdr_lite with file-based sensitivities.
    cdr_carbonate_sensitivity_time_interpolation: true
