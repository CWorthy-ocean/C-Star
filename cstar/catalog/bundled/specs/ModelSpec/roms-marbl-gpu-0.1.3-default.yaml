schema_version: 2.1.0
description: "Experimental: roms-marbl-gpu v0.1.3-beta (GPU ucla-roms with MARBL), ucla-roms 0.11.0 namelist tier"
application: ucla_roms_gpu
bgc_mode: marbl
use_pio: false
code:
  roms:
    location: https://github.com/CWorthy-ocean/roms-marbl-gpu.git
    commit: v0.1.3-beta
  # No `marbl` and no `pio`: MARBL is a submodule of roms-marbl-gpu (at v0.1.3-beta,
  # exactly marbl0.45.0, the release the CPU specs pin plus one commit that sets
  # max_bracket_grow_it=10, which does not change marbl_in), and the GPU model
  # has no ParallelIO.
  templates_commit: 1d3f643e03651e493369a68871012e5b980d66ee
  # No compile-time templates: the GPU build has no cppdefs.opt, so there is no
  # `cppdefs` section in `model_settings` either.
  templates_compile_time:
    directory: cstar/additional_files/templates/forge/compile-time
    files: []
  # marbl_in as the CPU specs pin it (see roms-marbl-0.11-default.yaml for how the
  # `file_hashes` are authored): same MARBL release, same file.
  templates_run_time:
    directory: cstar/additional_files/templates/forge/run-time
    files:
    - marbl_in
    file_hashes:
      marbl_in: 218976e818e81001b798c1eecbbc2f659c6e3f311db24da50d990cd69c300f8f
model_settings:
  # Compared with roms-marbl-0.11-default.yaml: no `cppdefs` (the GPU build takes no
  # cppdefs.opt) and no `pio_settings` (no ParallelIO), and `calc_pflx` is off.
  lateral_visc:
    visc2: 0.0
    rho0: 1000.0
  vertical_mixing:
    akv: 0.0
    akt_default: 0.0
  tracer_diff2:
    tnu2_default: 0.0
  bottom_drag:
    rdrg: 0.0
    rdrg2: 0.001
    zob: 0.01
  gamma2: 1.0
  ubind: 0.1
  param:
    nt_passive: 0
    ntrc_bio: 32
  bgc:
    nbgc_flx: 2
    interp_frc: 0
    xco2air_default: 284.7  # the GPU model fixes atmospheric CO2 at 284.7 ppm
  blk_frc:
    interp_frc: 0
    check_bulk_frc_units: false
  tides:
    bry_tides: true
    pot_tides: true
    ana_tides: false
  sponge_tune:
    pflx_w_vname: up_west
    pflx_w_tname: bry_time
    pflx_e_vname: up_east
    pflx_e_tname: bry_time
    pflx_s_vname: vp_south
    pflx_s_tname: bry_time
    pflx_n_vname: vp_north
    pflx_n_tname: bry_time
    ub_tune: false
    spn_avg: true
    sp_timscale: 86400
    wrt_sponge: false
    # nrpf * output_period (one file per day) evenly divides the restart period
    # for both the daily- and weekly-restarts OutputSpecs -- required by the
    # ucla-roms >= 0.5.0 check_output_divides_rst precheck when enabled.
    nrpf: 1
    output_period: 86400
  flux_frc:
    interp_flux_frc: true
  # Off: roms-marbl-gpu v0.1.3-beta does not compute the up/vp pressure fluxes (only
  # nesting needs them), so it takes no part in nesting.
  calc_pflx:
    calc_pflx: false
    timescale: 86400
  pipe_frc:
    pipe_source: false
    p_analytical: false
    npip: 1
  particles:
    floats: false
    np: 50
    extra_space_fac: 1.5
    exchange_facx: 0.1
    exchange_facy: 0.1
    exchange_facc: 0.01
    output_period: 400
    # 216 * 400 s = one file per day, which evenly divides the restart period
    # for both the daily- and weekly-restarts OutputSpecs -- required by the
    # ucla-roms >= 0.5.0 check_output_divides_rst precheck when enabled.
    nrpf: 216
    ppm3: 1.0e-06
    pmin: 200
  lin_rho_eos:
    tcoef: 0.2
    t0: 1.0
    scoef: 0.822
    s0: 1.0
  sss_correction:
    dsssdt: 7.777
  sst_correction:
    dsstdt: 7.777
  dic_alk_correction:
    dcdt: 7.777
  marbl_bgc:
    marbl_config_file: marbl_in
    marbl_timestep: 3600.0
    # Constant-iron option (ucla-roms >= 0.11.0, PR #391); off by default. Fe is in mmol/m^3 (1 nM = 1e-3).
    use_constant_fe: false
    constant_fe_value: 3.0e-3
