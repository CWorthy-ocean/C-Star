# yaml-language-server: $schema=https://raw.githubusercontent.com/CWorthy-ocean/C-Star/refs/heads/main/docs/schemas/wp/workplan_schema.1.2.0.json
schema_version: '1.2.0'
name: fan-out-workplan
description: A workplan that uses dependencies to gate execution of parallel steps.
steps:
- name: Step A
  application: ucla_roms
  blueprint: ~/code/cstar/cstar/additional_files/templates/blueprint.yaml
- name: Step B_1
  application: ucla_roms
  blueprint: ~/code/cstar/cstar/additional_files/templates/blueprint.yaml
  depends_on: ["Step A"]
- name: Step B_2
  application: ucla_roms
  blueprint: ~/code/cstar/cstar/additional_files/templates/blueprint.yaml
  depends_on: ["Step A"]
- name: Step B_3
  application: ucla_roms
  blueprint: ~/code/cstar/cstar/additional_files/templates/blueprint.yaml
  depends_on: ["Step A"]
state: draft
