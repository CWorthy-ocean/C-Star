# Render templates live at the forge repo root (templates/), decoupled from this
# ModelSpec: they track a ROMS version, change infrequently, and may move into the
# ucla-roms repo later. `directory` is relative to the repo root. At processing time
# the executor fetches these via C-Star's AdditionalCode from the forge git ref.
# Pin the serving forge commit with `commit:` (until pinned, the resolver defaults to
# branch `main`).
templates:
  commit: a2167c72ddc265203c9a3af69952e12469c640ec   # pin the forge commit that serves these templates
  compile_time:
    directory: "templates/compile-time"
    filter:
      files:
      - cppdefs.opt.j2

  run_time:
    directory: "templates/run-time"
    filter:
      files:
      - marbl_in

settings:
  properties:
    n_tracers: 34
    marbl: true
  compile_time:
    _default_config_yaml: "templates/compile-time-defaults.yml"
  run_time:
    _default_config_yaml: "templates/run-time-defaults.yml"

code:
  roms:
    location: https://github.com/CWorthy-ocean/ucla-roms.git
    commit: 83f40f2121bbfc5a7740c5560c8b36b315f2f2cd

  marbl:
    location: https://github.com/marbl-ecosys/MARBL.git
    commit: marbl0.45.0

  pio:
    location: https://github.com/NCAR/ParallelIO.git
    commit: pio2_7_0

inputs:
  grid:
    topography_source: ETOPO5

  initial_conditions:
    source:
      name: GLORYS
      glorys_layout: regional
    bgc_source:
      name: UNIFIED
      climatology: true

  forcing:
    surface:
      - source:
          name: ERA5
        type: physics
        correct_radiation: true
        coarse_grid_mode: "never"
      - source:
          name: UNIFIED
          climatology: true
        type: bgc
        coarse_grid_mode: "never"
      - source:
          name: MBL_co2
        type: bgc
        coarse_grid_mode: "never"

      - source:
           name: WOA
           climatology: true
        restoring_forces: ['sss']
        type: restoring
        coarse_grid_mode: "never"

    boundary:
      - source:
          name: GLORYS
          glorys_layout: regional
        type: physics
      - source:
          name: UNIFIED
          climatology: true
        type: bgc

    tidal:
      - source:
          name: TPXO
        ntides: 15

    river:
      - source:
          name: DAI
          climatology: false
        include_bgc: true
