# OutputSpec 'monthly-restarts' — restart files at calendar-month starts, the
# same convention as ucla-roms' own reference examples (monthly_restarts = T,
# output_period_rst = 0). The ucla-roms >= 0.5.0 precheck
# (check_output_divides_rst) tests mod(output_period_rst, nrpf * period), which
# is trivially satisfied for every stream when the periodic restart frequency
# is 0 — so all stream values are 'standard's. Note this means restart
# boundaries CAN truncate a partially-written output file at month starts;
# switching back to periodic restarts (monthly_restarts: false with a real
# output_period_rst) re-arms the precheck against these unadjusted values —
# use 'daily-restarts'/'weekly-restarts' for periodic-restart setups.
description: "Restarts at calendar-month starts (ucla-roms example convention); stream cadences as in 'standard'"

ocean_vars:
  wrt_file_rst: true
  output_period_rst: 0
  monthly_restarts: true
  nrpf_rst: 2
