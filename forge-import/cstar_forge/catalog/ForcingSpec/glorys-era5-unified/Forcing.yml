description: "GLORYS physics + UNIFIED BGC + ERA5 surface (+MBL_co2, WOA sss-restoring) + TPXO tides + DAI rivers"
# A ForcingSpec is a selectable forcing configuration (initial conditions + surface/
# boundary/tidal/river forcing). Every domain must explicitly pick one -- there is no
# "model default" fallback. Topography source/path are DomainSpec-owned (Domain.yml /
# the wizard's Grid section), not part of a ForcingSpec.

initial_conditions:
  source:
    name: GLORYS
    glorys_layout: regional
  bgc_source:
    name: UNIFIED
    climatology: true

forcing:
  surface:
    - source:
        name: ERA5
      type: physics
      correct_radiation: true
      coarse_grid_mode: "never"
    - source:
        name: UNIFIED
        climatology: true
      type: bgc
      coarse_grid_mode: "never"
    - source:
        name: MBL_co2
      type: bgc
      coarse_grid_mode: "never"
    - source:
        name: WOA
        climatology: true
      restoring_forces: ['sss']
      type: restoring
      coarse_grid_mode: "never"
  boundary:
    - source:
        name: GLORYS
        glorys_layout: regional
      type: physics
    - source:
        name: UNIFIED
        climatology: true
      type: bgc
  tidal:
    - source:
        name: TPXO
      ntides: 15
  river:
    - source:
        name: DAI
        climatology: false
      include_bgc: true
