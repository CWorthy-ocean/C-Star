  settings.upscale_output:
    title: Upscaled output
    required: false
  settings.zslice:
    title: Depth-slice output
    required: false
  settings.random_output:
    title: Random output
    required: false
  settings.calc_pflx:
    title: Pressure-flux calculation
    required: false
  settings.particles:
    title: Particle tracking
    required: false
  settings.extract_data:
    title: Child-grid boundary extraction
    required: false
fields:
  # ===========================================================================
  # bare wizard attributes (ForgeBlueprintWizard widgets with a description=)
  # ===========================================================================
  load_catalog_dd:
    label: From the catalog
  load_path:
    label: From a file
  upload:
    label: Upload blueprint file
  model_dd:
    label: Model preset
    required: true
  bgc_dd:
    label: Biogeochemistry
    hint: MARBL couples biogeochemistry to the physics; “none” runs physics only.
  domain_dd:
    label: Domain preset
    required: true
  grid_name:
    label: Grid name
    required: true
    hint: Short name for this grid; it becomes part of the domain and blueprint names.
  scoord_chk:
    label: Set the s-coordinate stretching explicitly
    hint: When checked, surface stretching, bottom stretching, and critical depth are passed to roms-tools to set the vertical stretching.
  v_sponge:
    label: Sponge viscosity
    symbol: v_sponge
    unit: m²/s
    hint: Maximum viscosity applied in the boundary sponge layer.
  npx:
    label: Processors, east–west
    symbol: n_procs_x
    required: true
    hint: Number of MPI tiles in the x-direction (east–west).
  npy:
    label: Processors, north–south
    symbol: n_procs_y
    required: true
    hint: Number of MPI tiles in the y-direction (north–south).
  use_pio_chk:
    label: Write output with ParallelIO (PIO)
    hint: 'Builds ROMS against the ParallelIO library: inputs are written as classic-format (CDF-5) netCDF and ROMS reads/writes joined files.'
  auto_tiling_chk:
    label: Automatic tiling
    hint: Picks the MPI tiling at runtime from the land mask (ucla-roms >= 0.5.0).
  n_cores:
    label: Total processors
    symbol: n_cores
    hint: Total MPI ranks.
  roms_ref:
    label: ucla-roms version
    symbol: ucla_roms_ref
    hint: ucla-roms checkout target (commit hash, tag, or branch).
  marbl_ref:
    label: MARBL version
    symbol: marbl_ref
    hint: MARBL checkout target (commit hash, tag, or branch).
  nest_enable:
    label: Enable child domain
    hint: 'Enables a child (nested) domain: generates nesting.nc to supply boundary conditions for the inner domain from this (outer) model.'
  nest_domain_dd:
    label: Child domain preset
    hint: Optionally prefill the child grid kwargs from a cataloged domain.
  child_topo_source:
    label: Child topography source
    hint: Topography dataset the child grid is built with when extracting nesting data.
  child_topo_path:
    label: Child topography file
    hint: Explicit topography file for the child grid.
  nest_period:
    label: Nesting extract period
    unit: s
    hint: How often boundary values are written to nesting.nc.
  nest_pressure_fluxes:
    label: Include pressure fluxes
    hint: Includes baroclinic pressure flux variables in nesting.nc.
  parent_enable:
    label: Enable parent domain
    hint: Declares that this grid is nested inside a coarser parent grid.
  parent_domain_dd:
    label: Parent domain preset
    hint: Optionally prefill the parent grid kwargs from a cataloged domain.
  parent_topo_source:
    label: Parent topography source
    hint: Topography dataset the parent grid is rebuilt with.
  parent_topo_path:
    label: Parent topography file
    hint: Explicit topography file for the parent grid.
  start:
    label: Start date
    required: true
    hint: Start date of the simulation run window.
  end:
    label: End date
    required: true
    hint: End date of the simulation run window.
  model_ref_date:
    label: Model reference date
    symbol: model_reference_date
    hint: ROMS model t=0 reference date.
  description:
    label: Description
    hint: Human-readable description of this blueprint.
  hmin:
    label: Minimum depth
    symbol: hmin
    unit: m
    hint: Minimum allowable ocean depth.
  close_narrow_chk:
    label: Close narrow channels
    symbol: close_narrow_channels
    hint: If checked, narrow water channels (width less than one grid cell) in the land mask are closed after the mask is generated.
  mask_shapefile:
    label: Land-mask shapefile
    symbol: mask_shapefile
    hint: Path to a custom shapefile used to determine the land/sea mask instead of the default NaturalEarth 10 m coastlines.
  bnd:
    label: Open boundaries
    hint: Sides that exchange water with the parent dataset.
  topo_source:
    label: Topography source
    symbol: topography_source
  topo_path:
    label: Topography file
    symbol: topo_path
    hint: Path to a custom topography file.
  grid_file_path:
    label: Grid file
    symbol: grid_file
    hint: Replaces the grid fields above; the file must exist at this path on the machine that runs the processing step.
  grid_file_upload:
    label: Upload grid file
  dt:
    label: Baroclinic time step
    symbol: dt
    unit: s
    hint: Set it directly, or click “Compute from CFL” to derive it from the grid.
  forcing_dd:
    label: Forcing preset
    required: true
    hint: Selects a named forcing spec from the catalog to seed all forcing fields.
  cdr_dd:
    label: CDR preset
    hint: Selects a named CDR spec from the catalog to seed the CDR mode and fields below, or leave as custom to author one by hand.
  cdr_mode_dd:
    label: CDR mode
  cdr_simple_name:
    label: CDR release name
  cdr_simple_start:
    label: CDR release start
  cdr_simple_end:
    label: CDR release end
  cdr_upload:
    label: Upload CDR YAML
    hint: A roms-tools CDRForcing.to_yaml() dump.
  cdr_file_path:
    label: CDR file
    hint: Attach a pre-made CDR-forcing netCDF instead of building one from the uploaded roms-tools YAML.
  cdr_file_upload:
    label: Upload CDR file
  cdr_plot_type_dd:
    label: CDR plot type
  cdr_plot_release_dd:
    label: CDR release
  output_dd:
    label: Output preset
    hint: Selects an output-settings spec from the catalog to seed the output sections.
  save_path:
    label: Save path
  name:
    label: Blueprint name
    hint: Drives the save filename, working directory and case name; edit to override the derived default.

  # ===========================================================================
  # grid.<k> -- the 11 grid kwargs, shared by main/child/parent grids
  # ===========================================================================
  grid.nx:
    label: Grid cells, east–west
    symbol: nx
    required: true
  grid.ny:
    label: Grid cells, north–south
    symbol: ny
    required: true
  grid.N:
    label: Vertical levels
    symbol: N
    required: true
  grid.size_x:
    label: Domain length, east–west
    symbol: size_x
    unit: km
    required: true
  grid.size_y:
    label: Domain length, north–south
    symbol: size_y
    unit: km
    required: true
  grid.center_lon:
    label: Center longitude
    symbol: center_lon
    unit: ° E
    required: true
  grid.center_lat:
    label: Center latitude
    symbol: center_lat
    unit: ° N
    required: true
  grid.rot:
    label: Rotation
    symbol: rot
    unit: °
    required: false
    hint: Counter-clockwise from due east.
  grid.theta_s:
    label: Surface stretching
    symbol: theta_s
    required: false
    hint: S-coordinate surface stretching parameter (0 < θs ≤ 10).
  grid.theta_b:
    label: Bottom stretching
    symbol: theta_b
    required: false
    hint: S-coordinate bottom stretching parameter (0 < θb ≤ 4).
  grid.hc:
    label: Critical depth
    symbol: hc
    unit: m
    required: false
    hint: S-coordinate critical depth.

  # ===========================================================================
  # ic.* -- _ForcingEditor's initial-conditions scalar pane
  # ===========================================================================
  ic.ic_name:
    label: Initial conditions
    required: true
    hint: Logical source name for physics initial conditions, e.g.
  ic.ic_layout:
    label: Initial conditions layout
    symbol: glorys_layout
    hint: 'GLORYS spatial layout override: regional (default) or global.'
  ic.ic_path:
    label: Initial conditions path
    hint: Explicit path to a custom dataset file for this source.
  ic.ic_bgc_interp:
    label: Biogeochemistry interpolation
    symbol: bgc_interpolation_method
    hint: 'Vertical interpolation for BGC tracer initial conditions: depth (default), density (isopycnal space), or density_mld (anchored to the mixed-layer depth).'
  ic.ic_flex_time:
    label: Flexible start time
    symbol: allow_flex_time
    hint: Allows a ±24-hour search window when looking for the requested initial time in the source dataset.
  ic.ic_validate:
    label: Validate initial conditions
    hint: Runs roms-tools' post-construction validation (NaN-at-wet-point checks).
  ic.ic_prefill:
    label: Source prefill
    symbol: prefill
    hint: Fills NaN (land/void) source cells before regridding.
  ic.ic_regrid_method:
    label: Regrid method
    symbol: regrid_method
    hint: Horizontal regrid engine.
  ic.ic_extrap_method:
    label: Extrapolation method
    symbol: extrap_method
    hint: Destination extrapolation on the default (no-prefill) path to guarantee NaN-free output.
  ic.ic_options:
    label: Additional options

  # ===========================================================================
  # boundary.* -- _ForcingEditor's boundary-forcing scalar pane (mirrors ic.*)
  # ===========================================================================
  boundary.boundary_name:
    label: Boundary conditions
    required: true
    hint: Logical source name for boundary conditions, e.g.
  boundary.boundary_layout:
    label: Boundary layout
    symbol: glorys_layout
    hint: 'GLORYS spatial layout: regional or global.'
  boundary.boundary_path:
    label: Boundary path
    hint: Explicit path to a custom dataset file for this source.
  boundary.boundary_bgc_interp:
    label: Biogeochemistry interpolation
    symbol: bgc_interpolation_method
    hint: 'Vertical interpolation for BGC boundary tracers: depth (default), density (isopycnal space), or density_mld (mixed-layer-depth anchored).'
  boundary.boundary_prefill:
    label: Source prefill
    symbol: prefill
    hint: Fills NaN (land/void) source cells before regridding.
  boundary.boundary_regrid_method:
    label: Regrid method
    symbol: regrid_method
    hint: Horizontal regrid engine.
  boundary.boundary_extrap_method:
    label: Extrapolation method
    symbol: extrap_method
    hint: Destination extrapolation on the default (no-prefill) path to guarantee NaN-free boundaries.
  boundary.boundary_validate:
    label: Validate boundary conditions
    hint: Runs roms-tools' post-construction validation (NaN-at-wet-point checks).
  boundary.boundary_options:
    label: Additional options

