# Label glossary for the blueprint-wizard page (the wizard UI, not the blueprint schema).
#
# See cstar_forge/ui/labels/__init__.py for the schema and namespace rules.
# `forcing.row.*`, `settings.*`, and `buttons.*` are only lightly seeded here
# (a few examples per namespace) -- a later pass fills them in fully.

sections:
  # --- top-level cards ------------------------------------------------------
  start:
    title: Start from an existing blueprint
    desc: Load a saved blueprint to edit it, or skip this to build one from scratch.
    required: false
  model:
    title: Model
    desc: Choose the ROMS-MARBL model preset, biogeochemistry mode, and code versions this blueprint builds against.
    required: true
  grid:
    title: Domain and grid
    desc: Where the model runs and how finely it is resolved.
    required: true
  forcing:
    title: Boundaries and forcing
    desc: Datasets that set the ocean state at the start and drive it at the edges.
    required: true
  run:
    title: Run setup
    desc: The simulation time window, time step, processor layout, and optional carbon dioxide removal forcing.
    required: true
  advanced:
    title: Advanced settings
    desc: Fine-tune individual ROMS-MARBL namelist settings beyond what the other cards expose.
    required: false
  review:
    title: Review and export
    desc: Check the resolved blueprint, then download it or save it to the catalog.
    required: false

  # --- grid subsections -------------------------------------------------------
  grid.geometry:
    title: Grid geometry
    desc: Horizontal extent, resolution, and orientation of the grid.
    required: false
  grid.vertical:
    title: Vertical coordinate
    desc: Number of vertical levels and the s-coordinate stretching parameters.
    required: false
  grid.bathymetry:
    title: Bathymetry and land mask
    desc: Topography source and land-mask options used to build the grid.
    required: false
  grid.gridfile:
    title: Pre-made grid file
    desc: Attach a pre-made grid netCDF instead of generating one from the kwargs above.
    required: false
  grid.derived:
    title: Derived from the grid
    desc: Open boundaries, sponge viscosity and the time step are derived from the grid unless you override them.
    required: false
  grid.nesting:
    title: Nesting
    desc: Optional parent/child relationship between this grid and a coarser or finer neighboring domain.
    required: false

  # --- forcing subsections -----------------------------------------------------
  forcing.ic.interpolation:
    title: Interpolation
    desc: How the source data is mapped onto the model grid.
    required: false
  forcing.boundary.interpolation:
    title: Interpolation
    desc: How the source data is mapped onto the model grid.
    required: false

  # --- run subsections ---------------------------------------------------------
  run.window:
    title: Run window
    desc: Start and end dates and the model reference date for the simulation.
    required: false
  run.partitioning:
    title: Partitioning
    desc: MPI processor layout and PIO/tiling options for the run.
    required: false
  run.cdr:
    title: Carbon dioxide removal (CDR)
    desc: Optional carbon dioxide removal forcing, imported or hand-authored.
    required: false

  # --- review subsections --------------------------------------------------------
  review.save_specs:
    title: Save specs to catalog
    desc: Save any modified model, domain, forcing, output, or CDR spec as a new named catalog entry.
    required: false
  review.run:
    title: Run
    desc: Invoke the C-Star CLI on the saved blueprint.
    required: false
  review.workplan:
    title: Workplan (experimental)
    desc: Save a deferred workplan that runs this blueprint later.
    required: false

  # --- example: an Advanced-settings section (namespace exercised, not exhaustive) ---
  settings.bgc:
    title: Biogeochemistry settings
    desc: MARBL biogeochemistry namelist options.
    required: false

  # --- Advanced settings: section headers (forge RunTimeSettings sections) ---
  settings.lateral_visc:
    title: Lateral viscosity
    required: false
  settings.vertical_mixing:
    title: Vertical mixing
    required: false
  settings.tracer_diff2:
    title: Tracer diffusion
    required: false
  settings.bottom_drag:
    title: Bottom drag
    required: false
  settings.sponge_tune:
    title: Sponge tuning
    required: false
  settings.gamma2:
    title: Lateral boundary slipperiness
    required: false
  settings.ubind:
    title: Open-boundary binding velocity
    required: false
  settings.lin_rho_eos:
    title: Linear equation of state
    required: false
  settings.pio_settings:
    title: Parallel I/O
    required: false
  settings.cppdefs:
    title: Compile-time options
    required: false
  settings.blk_frc:
    title: Bulk surface forcing
    required: false
  settings.flux_frc:
    title: Flux surface forcing
    required: false
  settings.tides:
    title: Tides
    required: false
  settings.pipe_frc:
    title: Pipe sources
    required: false
  settings.sss_correction:
    title: Sea-surface salinity correction
    required: false
  settings.sst_correction:
    title: Sea-surface temperature correction
    required: false
  settings.marbl_bgc:
    title: MARBL
    required: false
  settings.dic_alk_correction:
    title: DIC and alkalinity correction
    required: false
  settings.cdr_frc:
    title: CDR forcing
    required: false
  settings.cdr_output:
    title: CDR output
    required: false
  settings.ocean_vars:
    title: Physical state output
    required: false
  settings.surf_flux:
    title: Surface flux output
    required: false
  settings.diagnostics:
    title: Diagnostics output
    required: false
  settings.stdout_diag:
