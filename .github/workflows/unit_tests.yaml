name: unit_tests

on:
  # PRs test the merge with main; push runs on main catch post-merge breakage
  # and save the env cache that PR runs can read
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: unit-${{ matrix.os }}-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # the suite runs in ~2 minutes; don't let a teardown hang hold a runner
    # for the default 6 hours
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          cache-environment: true
          micromamba-version: 'latest'
          environment-file: environment-laptop.yml
          create-args: |
            python=${{ matrix.python-version }}

      - name: Environment info
        shell: micromamba-shell {0}                
        run: |
          conda info
          printenv

      - name: Install C-Star
        shell: micromamba-shell {0}
        run: |
           python -V
           python -m pip install -e ".[dev]" --force-reinstall

      - name: Locate pooch caches
        id: pooch-caches
        shell: micromamba-shell {0}
        run: |
          {
            echo "roms_tools_data=$(python -c "import pooch; print(pooch.os_cache('roms-tools'))")"
            echo "regionmask_data=$(python -c "import pooch; print(pooch.os_cache('regionmask'))")"
          } >> "$GITHUB_OUTPUT"

      # Pooch downloads are the only network access unit tests may make (see
      # `_block_network` in the unit conftest): building a real roms-tools Grid
      # fetches ETOPO5 and regionmask's Natural Earth land mask. Caches saved on
      # main are readable by every PR; a miss just re-downloads.
      - name: Cache unit test data
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pooch-caches.outputs.roms_tools_data }}
            ${{ steps.pooch-caches.outputs.regionmask_data }}
          key: ${{ runner.os }}-unit-data-${{ hashFiles('environment-laptop.yml') }}
          restore-keys: ${{ runner.os }}-unit-data-

      - name: Running Tests
        shell: micromamba-shell {0}        
        run: |
           python -V
           coverage run --rcfile=coverage.toml -m pytest -s --verbose cstar/tests/unit_tests/*
           
      - name: Get coverage report
        shell: micromamba-shell {0}                
        run: |
          coverage report -m || true ; coverage xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
