# yaml-language-server: $schema=https://raw.githubusercontent.com/CWorthy-ocean/C-Star/refs/heads/main/docs/schemas/bp/nest_ic/nest_ic_schema.1.0.0.json
name: create_nested_ic
description: create IC file from a parent
application: nest_ic
state: draft

parent_grid: "/path/to/parent_grid.nc"
parent_rst: "/path/to/parent_output/output_rst.20100105000000.nc"
child_grid: "/path/to/child_grid.nc"
working_dir: "~/cstar/nest_ic_example/"
# convert the initial conditions to CDF-5 for a ParallelIO-enabled child build
pio: true
