# yaml-language-server: $schema=https://raw.githubusercontent.com/CWorthy-ocean/C-Star/refs/heads/main/docs/schemas/wp/workplan_schema.1.0.0.json
#
# CCS nested + upscaled CDR example: a 16 km California Current parent with a 4 km
# child, one alkalinity release in the child, the child's tracer tendencies upscaled
# back onto the parent grid, and the CDR metrics of the two domains.
#
#   forge_parent -> parent -----------.--> child --> upscale --> parent_up
#   forge_child  -> nest_ic ----------'      |                     ^   |
#   forge_parent_up -------------------------|---------------------'   |
#                                            '--> cdr_metrics <--------'
#
#   parent       runs the parent over the whole window and writes the nesting
#                extraction (child boundaries) and daily restarts
#   nest_ic      interpolates the parent restart at the child's start onto the child grid
#   child        nest-from: parent (boundaries), continue-from: nest_ic (initial state);
#                releases ALK, writes the *_uscl upscaling files and _cdr output
#   upscale      turns the child's *_uscl files into parent-grid CDR forcing
#   parent_up    re-runs the parent grid from its own restart at the child's start, with
#                that CDR forcing (cdr.mode: upscaled); writes _cdr output
#   cdr_metrics  computes the CO2 uptake and uptake efficiency from the _cdr output of the
#                child (the release) and of parent_up (source_role: transfer: it carries
#                the child's alkalinity, not a new release), combined across the two
#                domains so the transferred alkalinity is not counted twice
#
# The three forge blueprints and the roms steps share one set of windows, given at run
# time through the runtime variables below; the same files serve a year-long and a
# month-long run. The values for the full run are in full.vars:
#
#   cstar workplan check workplan.yaml --varfile full.vars
#   cstar workplan run   workplan.yaml --varfile full.vars
#
# A shorter window needs different runtime variables (all of them, as a copy of full.vars
# with edited values or as --var key=value options: --var and --varfile cannot be combined)
# and lower time limits: see "Running a shorter window" in
# docs/tutorials/nesting_upscaling_ccs.rst.
#
# Model and tools: the blueprints use the roms-marbl-0.11-default ModelSpec, i.e. the
# ucla-roms 0.11.0 release, with no commit override. The child's boundary needs roms-tools
# main at or after f9b07d42 until a roms-tools release carries it.
#
# Where it runs: `compute_environment` names no launcher, so C-Star picks the one for the
# machine: SLURM where there is a scheduler, local processes otherwise (a workstation).
# Every step therefore carries both a `local` and a `slurm` entry in `compute_overrides`.
# On a SLURM machine the account and queue come from your environment, as C-Star's HPC
# docs (docs/hpc.rst) describe. `cstar workplan run` then submits all nine jobs, chained
# with SLURM dependencies, and returns; it does not have to keep running. The SLURM
# `num_cpus` of the roms steps (a deferred blueprint cannot be read at submit time) must
# equal the ranks, np_x * np_y of the vars file: 16 / 50 / 16 for full.vars (parent 4x4,
# child 5x10, parent_up 4x4). The forge steps ask for 32 CPUs because on many clusters the
# memory a job gets scales with its CPUs (forge peaks near 20 GB and was killed for memory
# at 8 CPUs on one).
#
# The SLURM time limits (`slurm.max_walltime`) are sized for full.vars: a 365-day parent
# and a 184-day child and parent_up, about 3 times the estimated time, rounded up. The
# estimate is rough, from rates measured per simulated day on one cluster: forge about 19 s
# (forge_child 15 s) plus 1 min fixed; ROMS 35 s for parent, 53 s for child and 51 s for
# parent_up, plus a 1.5 min build. For a shorter window lower the limits before
# `cstar workplan run` (shorter limits also let the scheduler start a job sooner). SLURM
# lets you lower a queued job's limit with `scontrol update` but not raise it, so a limit
# that is too small kills the job and everything after it.
#
# Runtime variables (the *_stamp form is the restart file name's 14-digit timestamp):
#   parent_start       start of the parent run and of forge_parent's forcing
#   parent_end         end of the parent run
#   child_start        start of the child and parent_up runs (a parent restart exists here)
#   child_start_stamp  child_start as YYYYMMDDHHMMSS (must agree with child_start)
#   child_end          end of the child and parent_up runs
#   cdr_end            end of the ALK release (30 days after child_start in full.vars)
#   parent_np_x/_y     MPI tiles of the parent and parent_up runs (must divide 168 and 336)
#   child_np_x/_y      MPI tiles of the child run (must divide 70 and 140)
#   cdr_output_period  averaging period (s) of the child's and parent_up's CDR output, and
#   cdr_output_nrpf    records per file (nrpf x period must divide the 86400 s restart
#                      period). Hourly CDR output on the parent grid is 5.9 GB per
#                      simulated day, so a full run wants 86400 and 1.
# Tiling is a forge-step override of domain.partitioning (it sets the ranks of the roms step
# and, at run time, np_xi/np_eta); the namelist forge writes keeps the committed 4x4/2x4.
name: ccs-nest-upscale
description: CCS 16 km parent, 4 km nested child with an ALK release, upscaled back onto the parent, with CDR metrics
state: draft

runtime_vars:
  - parent_start
  - parent_end
  - child_start
  - child_start_stamp
  - child_end
  - cdr_end
  - parent_np_x
  - parent_np_y
  - child_np_x
  - child_np_y
  - cdr_output_period
  - cdr_output_nrpf

steps:
  # ----------------------------------------------------------------- forge
  - name: forge_parent
    application: forge
    blueprint: ./forge_parent.yaml
    blueprint_overrides:
      domain:
        partitioning:
          n_procs_x: "{{parent_np_x}}"
          n_procs_y: "{{parent_np_y}}"
      run:
        start_date: "{{parent_start}}"
        end_date: "{{parent_end}}"
    compute_overrides:
      local:
        max_walltime: "12:00:00"  # full.vars about 3.2 h on a workstation (about 30 s per window day)
      slurm:
        num_cpus: 32
        max_walltime: "06:00:00"  # full.vars estimate about 2 h

  # forge_child and forge_parent_up wait for forge_parent so that any first-time
  # downloads (missing source data, the land-mask shapefiles) are done once rather than
  # by three forge steps at the same time. On a warm cache both lines can go and the
  # three forge steps then run in parallel.
  - name: forge_child
    application: forge
    blueprint: ./forge_child.yaml
    depends_on:
      - forge_parent
    blueprint_overrides:
      domain:
        partitioning:
          n_procs_x: "{{child_np_x}}"
          n_procs_y: "{{child_np_y}}"
      model_settings:
        cdr_output:
          output_period: "{{cdr_output_period}}"
          nrpf: "{{cdr_output_nrpf}}"
      run:
        start_date: "{{child_start}}"
        end_date: "{{child_end}}"
      cdr:
        cdr_forcing:
          start_time: "{{child_start}}"
          end_time: "{{child_end}}"
          releases:
            - times: ["{{child_start}}", "{{cdr_end}}"]
    compute_overrides:
      local:
        max_walltime: "04:00:00"  # full.vars about 0.7 h on a workstation
      slurm:
        num_cpus: 32
        max_walltime: "02:30:00"  # full.vars estimate about 0.8 h

  - name: forge_parent_up
    application: forge
    blueprint: ./forge_parent_up.yaml
    depends_on:
      - forge_parent
    blueprint_overrides:
      domain:
        partitioning:
          n_procs_x: "{{parent_np_x}}"
          n_procs_y: "{{parent_np_y}}"
      model_settings:
        cdr_output:
          output_period: "{{cdr_output_period}}"
          nrpf: "{{cdr_output_nrpf}}"
      run:
        start_date: "{{child_start}}"
        end_date: "{{child_end}}"
    compute_overrides:
      local:
        max_walltime: "08:00:00"  # full.vars about 1.7 h on a workstation
      slurm:
        num_cpus: 32
        max_walltime: "03:00:00"  # full.vars estimate about 1 h

  # ---------------------------------------------------------------- parent
  - name: parent
    application: roms_marbl
    blueprint:
      from_step: forge_parent
    depends_on:
      - forge_parent
    blueprint_overrides:
      runtime_params:
        end_date: "{{parent_end}}"
    compute_overrides:
      local:
        max_walltime: "24:00:00"  # build 1.5 min + full.vars about 2.3 h on a workstation (23 s per day)
      slurm:
        num_cpus: 16
        max_walltime: "11:00:00"  # full.vars estimate about 3.6 h

  # ---------------------------------------------------------------- nesting
  - name: nest_ic
    application: nest_ic
    blueprint: inline
    depends_on:
      - forge_parent
      - forge_child
      - parent
    blueprint_overrides:
      parent_grid: "{{root_dir: forge_parent}}/input_data/ccs-parent_grid.nc"
      parent_rst: "{{output_dir: parent}}/output_rst.{{child_start_stamp}}.nc"
      child_grid: "{{root_dir: forge_child}}/input_data/ccs-child_grid.nc"
      pio: true
    compute_overrides:
      local:
        max_walltime: "01:00:00"
      slurm:
        num_cpus: 4
        max_walltime: "00:30:00"

  - name: child
    application: roms_marbl
    blueprint:
      from_step: forge_child
    depends_on:
      - forge_child
      - nest_ic
      - parent
    blueprint_overrides:
      runtime_params:
        end_date: "{{child_end}}"
    directives:
      continue-from:
        step: nest_ic
      nest-from:
        step: parent
    compute_overrides:
      local:
        max_walltime: "24:00:00"  # build 1.5 min + full.vars about 0.9 h on a workstation (18 s per day)
      slurm:
        num_cpus: 50
        max_walltime: "08:30:00"  # full.vars estimate about 2.7 h

  # ------------------------------------------------------------- upscaling
  - name: upscale
    application: upscaler
    blueprint: inline
    depends_on:
      - child
    blueprint_overrides:
      uscl_file_location: "{{output_dir: child}}"
      pio: true
    compute_overrides:
      local:
        max_walltime: "01:00:00"
      slurm:
        num_cpus: 4
        max_walltime: "00:30:00"

  - name: parent_up
    application: roms_marbl
    blueprint:
      from_step: forge_parent_up
    depends_on:
      - forge_parent_up
      - parent
      - upscale
    blueprint_overrides:
      cdr_forcing:
        data:
          - location: "{{output_dir: upscale}}/upscaled_cdr.nc"
      runtime_params:
        end_date: "{{child_end}}"
    directives:
      continue-from:
        step: parent
        timestamp: "{{child_start}}"
    compute_overrides:
      local:
        max_walltime: "24:00:00"  # build 1.5 min + full.vars about 1.2 h on a workstation (23 s per day)
      slurm:
        num_cpus: 16
        max_walltime: "08:00:00"  # full.vars estimate about 2.6 h

  # ------------------------------------------------------------ CDR metrics
  # The child holds the release; parent_up carries the same alkalinity as a transfer.
  # Each domain is analysed on its own grid (the grid forge wrote for it), from the _cdr
  # output of its roms step. The metrics read the whole output of both steps.
  - name: cdr_metrics
    application: cdr_metrics
    blueprint: inline
    depends_on:
      - child
      - parent_up
    blueprint_overrides:
      domains:
        child:
          grid:
            location: "{{root_dir: forge_child}}/input_data/ccs-child_grid.nc"
          sources:
            - location: "{{output_dir: child}}"
        parent_up:
          source_role: transfer
          grid:
            location: "{{root_dir: forge_parent_up}}/input_data/ccs-parent-up_grid.nc"
          sources:
            - location: "{{output_dir: parent_up}}"
    compute_overrides:
      local:
        max_walltime: "04:00:00"
      slurm:
        num_cpus: 8
        max_walltime: "02:00:00"
