# yaml-language-server: $schema=https://raw.githubusercontent.com/CWorthy-ocean/C-Star/refs/heads/main/docs/schemas/wp/workplan_schema.1.0.0.json
name: example_workplan
description: Runs a Wales model, then a WIO model, all on your laptop!
state: draft

steps:
  - name: wales
    application: ucla_roms
    blueprint: ./wales_toy_blueprint.yaml
    
  - name: wio
    application: ucla_roms
    blueprint: ./wio_toy_blueprint.yaml
    depends_on:
      - wales


